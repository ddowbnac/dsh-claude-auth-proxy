# =============================================================================
# Renovate (dependency updates) — self-hosted in GitHub Actions
# -----------------------------------------------------------------------------
# Runs the official Renovate CLI (inside the official Docker image) as a
# workflow, so dependency updates live entirely in this repo's CI/CD: no
# external app install.
#
# What it does:
#   * Watches package.json + bun.lock (Renovate's `bun` manager owns both when
#     a bun.lock is present and no npm/pnpm/yarn lockfile exists).
#   * Opens PRs to bump outdated dependencies, updating package.json AND
#     regenerating bun.lock (runs `bun install --ignore-scripts`).
#   * Commits/titles PRs as `chore(deps): ...` (see renovate.json) so that
#     merging them NEVER triggers a release: `chore` is not a release-worthy
#     type under the conventional-commits preset used by semantic-release.
#
# Token (order of preference):
#   1. `RENOVATE_TOKEN` repo secret — a classic PAT with `repo` scope (safest,
#      no repo settings required).
#   2. Falls back to the built-in `GITHUB_TOKEN` — this requires the repo
#      setting Settings -> General -> Workflow -> "Allow GitHub Actions to
#      create and approve pull requests" to be ENABLED.
#
# Scheduling:
#   The `schedule` cron only makes the workflow *fire*; Renovate itself decides
#   whether there is work on that run. To quiet down runs, add a `schedule`
#   window to renovate.json (e.g. "schedule": ["* 0-5 * * 1-5"],
#   "timezone": "UTC").
# =============================================================================
name: Renovate

on:
  schedule:
    - cron: '0 * * * *' # fire hourly; Renovate no-ops when there is nothing to do
  workflow_dispatch: # manual trigger — first run / debugging

concurrency:
  group: renovate
  cancel-in-progress: false # never cancel a run mid-PR (could leave a half-written branch)

permissions:
  contents: write # push Renovate's dependency-update branches
  pull-requests: write # open the update PRs

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.6
        with:
          # PAT (RENOVATE_TOKEN) wins when set; otherwise GITHUB_TOKEN.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          # Pin the exact Renovate CLI version (recommended over the default major tag).
          renovate-version: 44.69.12
        env:
          LOG_LEVEL: info
          # Primary: name the repository explicitly (single-repo Actions run).
          # Fallback: if the explicit list is empty, autodiscover via the token
          # so Renovate always finds at least this repo. It clones the repo
          # independently via the token, so no actions/checkout is needed.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'true'
