name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint the workflow YAMLs themselves (cheap, no toolchain needed).
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint publishes no major tag (latest is v1.7.x), so pin the exact version.
      - uses: rhysd/actionlint@v1.7.12

  # Pin bun.lock to lockfileVersion 1.
  # WHY: Dependabot's bun updater image ships bun 1.3.5, whose lockfile parser
  # rejects "lockfileVersion": 2 (bun 1.4's default). A v2 lockfile makes EVERY
  # Dependabot run fail with Dependabot::DependencyFileNotSupported ("The bun
  # version Dependabot runs supports up to 1"), blocking all version/security
  # updates. v1 is readable by bun >= 1.1.39 (including 1.4 and 1.3.5), so
  # pinning v1 keeps Dependabot, CI, and local development all working.
  # Track removal in dependabot/dependabot-core#16026 - once Dependabot's
  # updater image ships bun >= 1.4, delete this job and allow v2 again.
  check-lockfile-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert bun.lock is lockfileVersion 1
        run: |
          set -euo pipefail
          # bun.lock is JSONC (bun allows trailing commas), so do not parse it
          # as strict JSON - extract the lockfileVersion number from its line.
          VERSION="$(grep -m1 "lockfileVersion" bun.lock | grep -o "[0-9]\{1,\}" | head -n1)"
          if [ "$VERSION" != "1" ]; then
            echo "::error::bun.lock is lockfileVersion ${VERSION:-unknown}. Keep it at 1 while Dependabot's updater image ships bun < 1.4 (dependabot-core#16026). Downgrade: set \"lockfileVersion\": 1 and run 'bun install --frozen-lockfile'."
            exit 1
          fi
          echo "bun.lock is lockfileVersion 1 - OK"

  # Verify sources compile under the strict tsconfig (bun-types).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  # Full offline suite.
  # Pinned to bun 1.4 for now (matches local toolchain); the lockfile is v1,
  # which older bun can also install frozen - see check-lockfile-version.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - run: bun install --frozen-lockfile
      - run: bun test

  # Produce the zero-runtime-dependency bundle and publish it for the surface-check job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: test -f lib/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: lib

  # scripts/smoke.mjs is live-only: it needs real Anthropic credentials and burns
  # tokens, so it never runs in CI. Instead, verify the bundle's export surface
  # offline across the runtimes the plugin ships to.
  # The bundle needs no node_modules, so no install step is required here.
  surface-check:
    name: surface-check (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 20
            runtime: node
            node-version: '20.x'
          - name: Node 22
            runtime: node
            node-version: '22.x'
          - name: Bun 1.4
            runtime: bun
            bun-version: '1.4'
    steps:
      - uses: actions/checkout@v4
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - uses: actions/download-artifact@v4
        with:
          # The `build` artifact holds the *contents* of lib/ at its root, so
          # extract into lib/ to restore lib/index.js (imported by the check below).
          name: build
          path: lib
      - if: matrix.runtime == 'node'
        run: |
          node -e 'import("./lib/index.js").then(m => {
            if (m.name !== "claude-auth" || m.inject?.[0] !== "llm" || typeof m.apply !== "function" || m.PROVIDER_ID !== "claude-subscription") process.exit(1);
            console.log("bundle surface ok");
          })'
      - if: matrix.runtime == 'bun'
        run: |
          bun -e 'import("./lib/index.js").then(m => {
            if (m.name !== "claude-auth" || m.inject?.[0] !== "llm" || typeof m.apply !== "function" || m.PROVIDER_ID !== "claude-subscription") process.exit(1);
            console.log("bundle surface ok");
          })'
